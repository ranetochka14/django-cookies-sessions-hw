{% extends 'main/base.html' %}
{% block content %}
<h2>Список статей</h2>
{% for article in articles %}
    <div class="card">
        <h3>{{ article.title }}</h3>
        <p>{{ article.content }}</p>
        <a href="{% url 'toggle_favorite' article.id %}">
            {% if article.id in request.session.favorites %}
                Удалить из избранного
            {% else %}
                Добавить в избранное
            {% endif %}
        </a>
    </div>
{% endfor %}
{% endblock %}
