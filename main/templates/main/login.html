{% extends 'main/base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: auto;">
    <h2>Вход в аккаунт</h2>
    <form method="post">
        {% csrf_token %}
        <p>
            <label>Логин:</label><br>
            <input type="text" name="username" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </p>
        <p>
            <label>Пароль:</label><br>
            <input type="password" name="password" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </p>
        <p>
            <label style="cursor: pointer;">
                <input type="checkbox" name="remember_me"> Запомнить меня
            </label>
        </p>
        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
